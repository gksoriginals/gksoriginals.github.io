<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Writing by Gopi on technology, learning, and original experiments.">
  <title>Blogs — GKS Originals</title>
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <main class="page">
    <a class="back" href="../">⌂ Home</a>
    <header class="masthead">
      <p class="kicker">GKS Originals</p>
      <h1>Notes from the<br><span>workbench.</span></h1>
      <p>Writing about technology, ideas, experiments, and the things I am still working out.</p>
    </header>

    <section class="writing" aria-labelledby="writing-heading">
      <div class="section-label"><span>✎</span><h2 id="writing-heading">Writing</h2></div>
      <div id="post-list" class="post-list" aria-live="polite"></div>
    </section>

    <section class="elsewhere" aria-labelledby="elsewhere-heading">
      <div class="section-label"><span>↗</span><h2 id="elsewhere-heading">Elsewhere</h2></div>
      <a class="elsewhere-link" href="https://substack.com/@gksoriginals" target="_blank" rel="noreferrer">
        <span>Substack</span>
        <small>Notes and writing beyond this site</small>
      </a>
    </section>
  </main>

  <script>
    const list = document.querySelector('#post-list');

    function escapeHtml(value) {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    }

    function renderList(posts) {
      if (!posts.length) {
        list.innerHTML = '<p class="empty-note">The first note is being made right now.</p>';
        return;
      }
      list.innerHTML = posts.map((post) => `
        <a class="post-card" href="post.html?slug=${encodeURIComponent(post.slug)}">
          <p class="post-date">${escapeHtml(post.date)}</p>
          <h3>${escapeHtml(post.title)}</h3>
          <p>${escapeHtml(post.description)}</p>
          <span class="read-more">Read post →</span>
        </a>
      `).join('');
    }

    async function start() {
      try {
        const response = await fetch('posts.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('The writing list could not be loaded.');
        const posts = await response.json();
        renderList(posts);
      } catch (error) {
        list.innerHTML = `<p class="empty-note">${escapeHtml(error.message)}</p>`;
      }
    }

    start();
  </script>
</body>
</html>
